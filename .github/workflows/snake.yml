name: Contribution snake

on:
  # Daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Regenerate only when this workflow itself changes. README-only edits do not
  # trigger it, and the bot commit below cannot retrigger it (pushes made with
  # GITHUB_TOKEN never start workflows, and the commit also carries [skip ci]).
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=dodgerblue

      - name: Validate generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/github-snake.svg dist/github-snake-dark.svg; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::missing or empty"
              exit 1
            fi
            size=$(wc -c < "$f")
            if [ "$size" -lt 1024 ]; then
              echo "::error file=$f::too small (${size} bytes), likely a failed render"
              exit 1
            fi
            if ! grep -q "<svg" "$f"; then
              echo "::error file=$f::does not contain an <svg> element"
              exit 1
            fi
            echo "$f OK (${size} bytes)"
          done

      - name: Copy into assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp dist/github-snake.svg dist/github-snake-dark.svg assets/

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Snake SVGs unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update contribution snake [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
