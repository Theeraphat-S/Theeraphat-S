name: Metrics
on:
  # Schedule daily update at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow workflow to be triggered manually
  workflow_dispatch:
  # Push on main branch
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Left Column: Header, 3D Isometric Calendar, Languages
      - name: Left Column Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Theeraphat-S
          template: classic
          base: header
          config_timezone: Asia/Bangkok
          filename: assets/github-metrics-left.svg
          config_order: base.header, isocalendar, languages

          # Plugin: 3D Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Plugin: Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      # Right Column: Activity, Community, Repositories, Starred, Followers
      - name: Right Column Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Theeraphat-S
          template: classic
          base: activity, community, repositories
          config_timezone: Asia/Bangkok
          filename: assets/github-metrics-right.svg
          config_order: base.activity, base.community, base.repositories, stars, people

          # Plugin: Recently Starred
          plugin_stars: yes
          plugin_stars_limit: 4

          # Plugin: Followers
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers

  github-stats:
    needs: github-metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Theeraphat-S
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark&color_snake=dodgerblue

      - name: Download GitHub Stats, Streak & Languages SVGs
        run: |
          mkdir -p assets
          curl -s -f "https://github-stats-extended.vercel.app/api?username=Theeraphat-S&show_icons=true&hide_rank=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=58a6ff&icon_color=58a6ff&text_color=c9d1d9" -o assets/github-stats.svg || echo "Failed to download stats"
          curl -s -f "https://streak-stats.demolab.com/?user=Theeraphat-S&theme=tokyonight&hide_border=true&background=0d1117&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff" -o assets/github-streak.svg || echo "Failed to download streak"
          curl -s -f "https://github-stats-extended.vercel.app/api/top-langs/?username=Theeraphat-S&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9" -o assets/github-languages.svg || echo "Failed to download languages"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-streak.svg assets/github-languages.svg assets/github-snake.svg assets/github-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub stats, streak, snake and languages SVGs [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in stats SVGs"
          fi
