name: Metrics
on:
  # Schedule daily update at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow workflow to be triggered manually
  workflow_dispatch:
  # Push on main branch
  push:
    branches: ["main", "master"]

jobs:
  update-pixel-profile:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Theeraphat-S
          outputs: |
            assets/github-snake.svg?color_snake=#1f6feb&color_dots=#d8dee4,#bae6fd,#38bdf8,#1f6feb,#0969da
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b2e,#133058,#1f6feb,#38bdf8,#7ee787

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Square off snake cells to match the pixel style
        run: |
          python .github/scripts/crisp_snake.py assets/github-snake.svg assets/github-snake-dark.svg

      - name: Generate Pixel RPG Stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_pixel_stats.py --user Theeraphat-S --output assets/pixel-stats.svg

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel-stats.svg assets/github-snake.svg assets/github-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pixel stats and contribution snake SVGs [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in pixel stats or snake SVGs"
          fi
