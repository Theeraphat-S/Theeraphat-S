<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="50%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>

    <!-- Banner Gradient -->
    <linearGradient id="banner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="avatar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#58a6ff" flood-opacity="0.35"/>
    </filter>

    <filter id="pill-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Avatar Clip -->
    <clipPath id="avatar-clip">
      <rect x="24" y="24" width="100" height="100" rx="22" ry="22"/>
    </clipPath>

    <!-- Card Clip -->
    <clipPath id="card-clip">
      <rect width="400" height="560" rx="28" ry="28"/>
    </clipPath>

    <!-- Pattern -->
    <pattern id="banner-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 12 L12 0 L24 12 L12 24 Z" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #ffffff; }
    .handle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #8b949e; }
    .bio { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13.5px; fill: #c9d1d9; line-height: 1.5; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #f0f6fc; text-anchor: middle; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 10px; fill: #8b949e; text-anchor: middle; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace; font-weight: 500; font-size: 11.5px; fill: #e6edf3; }
    .footer-brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #58a6ff; }
  </style>

  <!-- Main Card Base -->
  <g clip-path="url(#card-clip)">
    <!-- Background -->
    <rect width="400" height="560" fill="url(#card-bg)"/>

    <!-- Top Mesh Banner -->
    <rect width="400" height="195" fill="url(#banner-grad)"/>
    <rect width="400" height="195" fill="url(#banner-pattern)"/>

    <!-- Banner Overlay Gradient for Depth -->
    <rect width="400" height="195" fill="url(#card-bg)" opacity="0.15"/>

    <!-- Avatar Container -->
    <g filter="url(#avatar-glow)">
      <!-- Outer White Glow Border -->
      <rect x="22" y="22" width="104" height="104" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9"/>
      <!-- Avatar Image -->
      <image href="https://github.com/Theeraphat-S.png" x="24" y="24" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)"/>
    </g>

    <!-- Stats Bar (Floating Glass Pill) -->
    <g filter="url(#pill-shadow)">
      <rect x="20" y="152" width="360" height="66" rx="16" ry="16" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
      
      <!-- Stat 1: Live Apps -->
      <g transform="translate(76, 172)">
        <text class="stat-val" y="0">2+ Apps</text>
        <g transform="translate(-32, 10)">
          <!-- Rocket / Production Icon -->
          <circle cx="0" cy="4" r="6" fill="#58a6ff" fill-opacity="0.2"/>
          <path d="M-3 4 L0 1 L3 4 L1 4 L1 7 L-1 7 L-1 4 Z" fill="#58a6ff"/>
          <text class="stat-lbl" x="32" y="7">Production</text>
        </g>
      </g>

      <line x1="140" y1="164" x2="140" y2="206" stroke="#21262d" stroke-width="1.2"/>

      <!-- Stat 2: Super App -->
      <g transform="translate(200, 172)">
        <text class="stat-val" y="0">Super App</text>
        <g transform="translate(-34, 10)">
          <!-- Flame / Architecture Icon -->
          <circle cx="0" cy="4" r="6" fill="#ec4899" fill-opacity="0.2"/>
          <path d="M0 1 C-2 3 -2 5 0 7 C2 5 2 3 0 1 Z" fill="#ec4899"/>
          <text class="stat-lbl" x="34" y="7">Architecture</text>
        </g>
      </g>

      <line x1="260" y1="164" x2="260" y2="206" stroke="#21262d" stroke-width="1.2"/>

      <!-- Stat 3: Core Stack -->
      <g transform="translate(324, 172)">
        <text class="stat-val" y="0">Flutter &amp; Go</text>
        <g transform="translate(-30, 10)">
          <!-- Target / Core Icon -->
          <circle cx="0" cy="4" r="6" fill="#3fb950" fill-opacity="0.2"/>
          <circle cx="0" cy="4" r="2.5" fill="#3fb950"/>
          <text class="stat-lbl" x="30" y="7">Core Stack</text>
        </g>
      </g>
    </g>

    <!-- Profile Identity -->
    <g transform="translate(24, 252)">
      <text class="title" x="0" y="0">Theeraphat Srimontha</text>
      <text class="handle" x="0" y="20">@Theeraphat-S <tspan fill="#484f58">•</tspan> Mobile &amp; Super-App Engineer</text>
    </g>

    <!-- Bio Description -->
    <g transform="translate(24, 302)">
      <text class="bio" x="0" y="0">
        <tspan x="0" dy="0">👋 Hey! I'm a Mobile Developer building scalable</tspan>
        <tspan x="0" dy="21">production super-apps, cross-platform Flutter experiences,</tspan>
        <tspan x="0" dy="21">and resilient Go &amp; Spring Boot backend microservices.</tspan>
      </text>
    </g>

    <!-- Hashtag Badges -->
    <g transform="translate(24, 385)">
      <!-- Row 1 -->
      <!-- #flutter -->
      <g transform="translate(0, 0)">
        <rect width="84" height="28" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text class="tag" x="42" y="18" text-anchor="middle">#flutter</text>
      </g>
      <!-- #superapp -->
      <g transform="translate(92, 0)">
        <rect width="96" height="28" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text class="tag" x="48" y="18" text-anchor="middle">#superapp</text>
      </g>
      <!-- #mobiledev -->
      <g transform="translate(196, 0)">
        <rect width="102" height="28" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text class="tag" x="51" y="18" text-anchor="middle">#mobiledev</text>
      </g>
      <!-- #dart -->
      <g transform="translate(306, 0)">
        <rect width="46" height="28" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text class="tag" x="23" y="18" text-anchor="middle">#dart</text>
      </g>

      <!-- Row 2 -->
      <!-- #golang -->
      <g transform="translate(0, 36)">
        <rect width="80" height="28" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text class="tag" x="40" y="18" text-anchor="middle">#golang</text>
      </g>
      <!-- #springboot -->
      <g transform="translate(88, 36)">
        <rect width="108" height="28" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text class="tag" x="54" y="18" text-anchor="middle">#springboot</text>
      </g>
      <!-- #crossplatform -->
      <g transform="translate(204, 36)">
        <rect width="134" height="28" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text class="tag" x="67" y="18" text-anchor="middle">#crossplatform</text>
      </g>
    </g>

    <!-- Bottom Separator & Footer -->
    <rect x="0" y="492" width="400" height="68" fill="#0b0f14"/>
    <line x1="0" y1="492" x2="400" y2="492" stroke="#21262d" stroke-width="1"/>

    <!-- Bottom Tech Mini Badges -->
    <g transform="translate(24, 514)">
      <!-- Flutter Icon -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="12" fill="#02569B" fill-opacity="0.25"/>
        <path d="M14 6 L8 12 L14 18 L18 18 L12 12 L18 6 Z" fill="#54C5F8" transform="scale(0.8) translate(3, 3)"/>
      </g>
      <!-- Go Icon -->
      <g transform="translate(32, 0)">
        <circle cx="12" cy="12" r="12" fill="#00ADD8" fill-opacity="0.25"/>
        <text font-family="-apple-system, sans-serif" font-weight="900" font-size="10" fill="#00ADD8" x="12" y="16" text-anchor="middle">GO</text>
      </g>
      <!-- Spring Icon -->
      <g transform="translate(64, 0)">
        <circle cx="12" cy="12" r="12" fill="#6DB33F" fill-opacity="0.25"/>
        <circle cx="12" cy="12" r="5" fill="#6DB33F"/>
      </g>
      <!-- React Icon -->
      <g transform="translate(96, 0)">
        <circle cx="12" cy="12" r="12" fill="#61DAFB" fill-opacity="0.2"/>
        <ellipse cx="12" cy="12" rx="7" ry="2.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(30 12 12)"/>
        <ellipse cx="12" cy="12" rx="7" ry="2.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(-30 12 12)"/>
      </g>
      <!-- Supabase / Postgres Icon -->
      <g transform="translate(128, 0)">
        <circle cx="12" cy="12" r="12" fill="#3ECF8E" fill-opacity="0.2"/>
        <path d="M13 5 L8 13 L12 13 L11 19 L16 11 L12 11 Z" fill="#3ECF8E"/>
      </g>
    </g>

    <!-- Bottom Brand Signature -->
    <g transform="translate(376, 529)" text-anchor="end">
      <!-- Icon Sparkle -->
      <path d="M-132 -6 L-129 -14 L-126 -6 L-118 -3 L-126 0 L-129 8 L-132 0 L-140 -3 Z" fill="#58a6ff"/>
      <text class="footer-brand" x="0" y="0">theeraphat.dev</text>
    </g>

    <!-- Outer Card Border -->
    <rect width="400" height="560" rx="28" ry="28" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
